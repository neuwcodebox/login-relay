name: ARM64 relay image
on:
  workflow_dispatch:
    inputs:
      publish_public_image:
        description: Publish the owner-approved image to the existing repository's GHCR name
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund && python -m pip install ./python
      - run: npm run check && npm test && PYTHONPATH=python python -m unittest discover -s python/tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Read-only non-root ARM64 runtime smoke
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          node --input-type=module - <<'JS' > "$RUNNER_TEMP/test-clients.json"
          import { generateKeyPairSync } from 'node:crypto';
          const key = generateKeyPairSync('ed25519');
          console.log(JSON.stringify({ clients: { synthetic: key.publicKey.export({format:'jwk'}) } }));
          JS
          chmod 644 "$RUNNER_TEMP/test-clients.json"
          docker run -d --name relay-smoke --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/test-clients.json,dst=/run/config/clients.json,readonly" \
            -e PUBLIC_BASE_DOMAIN=example.test -e API_HOST=relay-login.example.test \
            -e CLIENT_TRUST_FILE=/run/config/clients.json "$IMAGE"
          trap 'docker rm -f relay-smoke >/dev/null' EXIT
          for attempt in $(seq 1 15); do
            if docker exec relay-smoke node --input-type=module -e "const r=await fetch('http://127.0.0.1:3000/readyz');if(r.status!==200)process.exit(1)"; then break; fi
            if [ "$attempt" = 15 ]; then exit 1; fi
            sleep 1
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish_public_image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable image after checks
        if: inputs.publish_public_image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
